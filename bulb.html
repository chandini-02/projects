
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
        <title>on/off</title>
        <style>
            body{
                text-align:center;
            }
        </style>    
    </head>
    <body>
        <h1>light</h1>
        <h2 id="status"></h2>
        <button onclick="turnon()"> on </button>
        <button onclick="turnoff()"> off </button>
        <script>
            function turnon(){
                  document.getElementById("status").innerText="💡✨";
            }
            function turnoff(){
                  document.getElementById("status").innerText="💡";
            }  
        </script>     
    </body> 
</html>
