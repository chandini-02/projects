<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz App</title>

    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        /* Quiz Container */
        .quiz-container {
            width: 100%;
            max-width: 650px;
            background: white;

            padding: 30px;
            border-radius: 20px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        /* Heading */
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 32px;
        }

        /* Top Section */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 25px;
        }

        /* Progress */
        #progress {
            font-size: 16px;
            color: #555;
            font-weight: bold;
        }

        /* Timer */
        .timer {
            background: #222;
            color: white;

            padding: 10px 18px;
            border-radius: 10px;

            font-size: 18px;
            font-weight: bold;
        }

        /* Timer Warning */
        .timer.warning {
            background: #e74c3c;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0.5;
            }
        }

        /* Question */
        #question {
            font-size: 23px;
            color: #222;

            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* Answer Buttons */
        .answer-btn {
            width: 100%;

            padding: 15px;
            margin-bottom: 12px;

            border: 2px solid #ddd;
            border-radius: 10px;

            background: #fff;
            color: #333;

            font-size: 16px;
            text-align: left;

            cursor: pointer;

            transition: all 0.3s ease;
        }

        .answer-btn:hover:not(:disabled) {
            background: #f0f3ff;
            border-color: #667eea;
            transform: translateX(5px);
        }

        /* Correct Answer */
        .answer-btn.correct {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        /* Wrong Answer */
        .answer-btn.wrong {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }

        /* Disabled */
        .answer-btn:disabled {
            cursor: not-allowed;
        }

        /* Next Button */
        #next-btn,
        #restart-btn {
            width: 100%;

            padding: 15px;

            border: none;
            border-radius: 10px;

            background: #667eea;
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        #next-btn:hover,
        #restart-btn:hover {
            background: #5568d9;
            transform: translateY(-2px);
        }

        /* Hide Next Button */
        #next-btn {
            display: none;
        }

        /* Result */
        #result {
            text-align: center;
        }

        #result h2 {
            color: #333;
            font-size: 30px;
            margin-bottom: 20px;
        }

        #score {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;

            margin-bottom: 25px;
        }

        /* Hidden */
        .hidden {
            display: none;
        }

        /* Mobile Responsive */
        @media (max-width: 500px) {
            .quiz-container {
                padding: 20px;
            }

            h1 {
                font-size: 26px;
            }

            #question {
                font-size: 19px;
            }

            .top-bar {
                flex-direction: column;
                gap: 12px;
                align-items: stretch;
            }

            #progress {
                text-align: center;
            }

            .timer {
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <div class="quiz-container">

        <h1>Quiz App</h1>

        <!-- Quiz -->
        <div id="quiz-box">

            <div class="top-bar">

                <div id="progress">
                    Question 1 of 5
                </div>

                <div class="timer">
                    Time: <span id="time">60</span>s
                </div>

            </div>

            <h2 id="question"></h2>

            <div id="answers"></div>

            <button id="next-btn">
                Next Question
            </button>

        </div>

        <!-- Result -->
        <div id="result" class="hidden">

            <h2>Quiz Completed!</h2>

            <p id="score"></p>

            <button id="restart-btn">
                Restart Quiz
            </button>

        </div>

    </div>


    <script>

        /* Questions */

        const questions = [

            {
                question: "What does HTML stand for?",
                answers: [
                    "Hyper Text Markup Language",
                    "High Tech Modern Language",
                    "Hyperlink Text Management Language",
                    "Home Tool Markup Language"
                ],
                correct: 0
            },

            {
                question: "Which language is used to style web pages?",
                answers: [
                    "HTML",
                    "CSS",
                    "JavaScript",
                    "Python"
                ],
                correct: 1
            },

            {
                question: "Which language is used to add interactivity to a webpage?",
                answers: [
                    "CSS",
                    "HTML",
                    "JavaScript",
                    "SQL"
                ],
                correct: 2
            },

            {
                question: "Which HTML tag is used to create a hyperlink?",
                answers: [
                    "<p>",
                    "<a>",
                    "<link>",
                    "<href>"
                ],
                correct: 1
            },

            {
                question: "Which symbol is used for an ID selector in CSS?",
                answers: [
                    ".",
                    "#",
                    "*",
                    "@"
                ],
                correct: 1
            }

        ];


        /* Variables */

        let currentQuestion = 0;
        let score = 0;

        let timeLeft = 60;
        let timer;


        /* Elements */

        const questionElement =
            document.getElementById("question");

        const answersElement =
            document.getElementById("answers");

        const nextButton =
            document.getElementById("next-btn");

        const progressElement =
            document.getElementById("progress");

        const timeElement =
            document.getElementById("time");

        const timerElement =
            document.querySelector(".timer");

        const quizBox =
            document.getElementById("quiz-box");

        const resultBox =
            document.getElementById("result");

        const scoreElement =
            document.getElementById("score");

        const restartButton =
            document.getElementById("restart-btn");


        /* Load Question */

        function loadQuestion() {

            const current = questions[currentQuestion];

            progressElement.textContent =
                `Question ${currentQuestion + 1} of ${questions.length}`;

            questionElement.textContent =
                current.question;

            answersElement.innerHTML = "";

            current.answers.forEach((answer, index) => {

                const button =
                    document.createElement("button");

                button.textContent = answer;

                button.classList.add("answer-btn");

                button.addEventListener("click", () => {

                    selectAnswer(button, index);

                });

                answersElement.appendChild(button);

            });

            nextButton.style.display = "none";
        }


        /* Select Answer */

        function selectAnswer(button, selectedIndex) {

            const correctIndex =
                questions[currentQuestion].correct;

            const buttons =
                document.querySelectorAll(".answer-btn");

            buttons.forEach(btn => {
                btn.disabled = true;
            });


            if (selectedIndex === correctIndex) {

                button.classList.add("correct");

                score++;

            } else {

                button.classList.add("wrong");

                buttons[correctIndex]
                    .classList.add("correct");
            }


            nextButton.style.display = "block";
        }


        /* Next Question */

        nextButton.addEventListener("click", () => {

            currentQuestion++;

            if (currentQuestion < questions.length) {

                loadQuestion();

            } else {

                showResult();

            }

        });


        /* Timer */

        function startTimer() {

            clearInterval(timer);

            timeLeft = 60;

            timeElement.textContent = timeLeft;

            timerElement.classList.remove("warning");


            timer = setInterval(() => {

                timeLeft--;

                timeElement.textContent = timeLeft;


                /* Warning at 10 seconds */

                if (timeLeft <= 10) {

                    timerElement.classList.add("warning");

                }


                /* Time Finished */

                if (timeLeft <= 0) {

                    clearInterval(timer);

                    showResult();

                }

            }, 1000);

        }


        /* Show Result */

        function showResult() {

            clearInterval(timer);

            quizBox.classList.add("hidden");

            resultBox.classList.remove("hidden");

            scoreElement.textContent =
                `Your Score: ${score} / ${questions.length}`;

        }


        /* Restart Quiz */

        restartButton.addEventListener("click", () => {

            currentQuestion = 0;

            score = 0;

            timeLeft = 60;

            resultBox.classList.add("hidden");

            quizBox.classList.remove("hidden");

            loadQuestion();

            startTimer();

        });


        /* Start Quiz */

        loadQuestion();

        startTimer();

    </script>

</body>
</html>
